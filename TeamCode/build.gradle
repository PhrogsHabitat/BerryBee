//
// build.gradle in TeamCode
//

apply plugin: 'com.android.application'

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    // compileSdk 34 is required by Pedro Pathing
    compileSdk 34

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')

    // Third-party libraries required by your team code
    implementation 'com.pedropathing:revhub:3.0.1'
    implementation 'com.pedropathing:tuning:1.0.1'
    implementation 'com.bylazar:fullpanels:1.0.12'

    // FTCLib — required for com.arcrobotics.ftclib.* imports
    implementation 'org.ftclib.ftclib:core:2.1.1'
    // Optional: only include this if you use FTCLib's vision pipelines
    implementation 'org.ftclib.ftclib:vision:2.1.0'
}